<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Herd Mentality</title>
<style>
@font-face { font-family: playbean; src: url(Playbean.ttf); }

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    overflow: hidden;
    min-height: 100vh;
    font-family: playbean, sans-serif;
}

#bg {
    width: 120%;
    position: absolute;
    overflow: hidden;
    left: -1%;
    top: -130%;
    z-index: -1;
    opacity: 1;
}

#title {
    color: rgb(206, 97, 177);
    text-align: center;
    font-size: 70px;
    font-family: playbean;
    font-weight: bold;
    position: absolute;
    left: 33%;
    top: 10%;
    z-index: 2;
}

#smolcow {
    height: 30%;
    position: absolute;
    top: 10%;
    left: -1%;
    z-index: 0;
}

#bottomsmolcow {
    height: 20%;
    position: absolute;
    top: 75%;
    left: 88%;
    z-index: 0;
}

#bootscow {
    height: 15%;
    position: absolute;
    top: 72%;
    left: 18%;
    z-index: 1;
}

#sitcow {
    height: 15%;
    position: absolute;
    top: 16%;
    left: 70%;
    z-index: 1;
}

#bigbox {
    height: 550px;
    width: 1000px;
    position: absolute;
    background-color: rgb(235, 235, 235);
    opacity: 0.6;
    z-index: 1;
    left: 15%;
    top: 27%;
    border-radius: 10px;
}

#sidebar {
    display: none;
    position: fixed;
    right: 20px;
    top: 20px;
    background: rgba(235, 235, 235, 0.95);
    border-radius: 14px;
    padding: 16px 20px;
    min-width: 180px;
    z-index: 10;
}
#sidebar h3 {
    color: rgb(206, 97, 177);
    font-size: 20px;
    font-family: playbean;
    margin-bottom: 8px;
    text-align: center;
}
.sidebar-row {
    display: flex;
    justify-content: space-between;
    font-size: 16px;
    padding: 2px 0;
    border-bottom: 1px solid #ddd;
    font-family: playbean;
}

.screen {
    display: none;
    position: absolute;
    width: 1000px;
    left: 15%;
    top: 27%;
    height: 550px;
    z-index: 3;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    padding: 30px;
}
.screen.active { display: flex; }

.card {
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 340px;
    align-items: center;
    width: 100%;
    max-width: 560px;
}

input[type=text] {
    font-family: playbean;
    font-size: 22px;
    padding: 10px 16px;
    border-radius: 10px;
    border: 2px solid rgb(206, 97, 177);
    outline: none;
    width: 100%;
    background: rgba(255,255,255,0.9);
}

button {
    font-family: playbean;
    font-size: 22px;
    padding: 10px 28px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background: rgb(206, 97, 177);
    color: white;
    transition: opacity 0.2s;
    width: 100%;
}
button:hover { opacity: 0.85; }
button.secondary { background: rgb(180, 180, 180); }

.error  { color: red; font-size: 18px; text-align: center; font-family: playbean; }
.notice { color: #444; font-size: 18px; text-align: center; font-family: playbean; }

#player-list { list-style: none; font-size: 20px; font-family: playbean; width: 100%; }
#player-list li::before { content: "🐄 "; }

.room-code {
    font-size: 42px;
    font-weight: bold;
    color: rgb(206, 97, 177);
    letter-spacing: 6px;
    text-align: center;
    font-family: playbean;
}

#question-text {
    font-size: 30px;
    font-weight: bold;
    color: #333;
    text-align: center;
    font-family: playbean;
}

.answer-row {
    display: flex;
    justify-content: space-between;
    font-size: 18px;
    padding: 4px 0;
    border-bottom: 1px solid #ccc;
    width: 100%;
    font-family: playbean;
}
.score-row {
    display: flex;
    justify-content: space-between;
    font-size: 18px;
    padding: 4px 0;
    width: 100%;
    font-family: playbean;
}
.pre-score-row {
    display: flex;
    justify-content: space-between;
    font-size: 20px;
    padding: 5px 0;
    border-bottom: 1px solid #ccc;
    font-family: playbean;
    width: 100%;
}

#winner-name {
    font-size: 48px;
    color: rgb(206, 97, 177);
    font-weight: bold;
    text-align: center;
    font-family: playbean;
}

.results-scroll {
    max-height: 180px;
    overflow-y: auto;
    width: 100%;
}
</style>
</head>
<body>

<img id="bg" src="pngtree-cow-pattern-black-and-white-background-picture-image_1334752.png">
<div id="title">herd mentality</div>
<img id="smolcow"       src="d23b8931dc9633b7876e880ccce6619d.jpg">
<img id="bottomsmolcow" src="8568beb0f9d2f4c2bd17d51fe8df586c.jpg">
<img id="bootscow"      src="b9356508d17971a704ea1fb2adb58bdb-removebg-preview.png">
<img id="sitcow"        src="89affb67c8b7b1371b7be134ee03178f-removebg-preview.png">
<div id="bigbox"></div>

<div id="sidebar">
    <h3>📊 scores</h3>
    <div id="sidebar-scores"></div>
</div>

<div class="screen active" id="screen-join">
  <div class="card">
    <input type="text" id="input-name" placeholder="your name">
    <input type="text" id="input-code" placeholder="room code (to join)">
    <button onclick="joinRoom()">join room</button>
    <button class="secondary" onclick="createRoom()">create room</button>
    <div class="error" id="join-error"></div>
  </div>
</div>

<div class="screen" id="screen-lobby">
  <div class="card">
    <div class="notice">room code</div>
    <div class="room-code" id="lobby-code"></div>
    <div class="notice">players joined:</div>
    <ul id="player-list"></ul>
    <button id="start-btn" style="display:none" onclick="startGame()">start game</button>
    <div class="notice" id="waiting-notice">waiting for host to start...</div>
    <div class="error" id="lobby-error"></div>
  </div>
</div>

<div class="screen" id="screen-pre-round">
  <div class="card" style="max-width:480px">
    <div class="notice" style="font-size:26px;font-weight:bold" id="pre-round-label">round 1 starting!</div>
    <div class="notice">current scores</div>
    <div id="pre-round-scoreboard" style="width:100%"></div>
    <div class="notice" id="pre-round-countdown">get ready...</div>
  </div>
</div>

<div class="screen" id="screen-waiting-next">
  <div class="card">
    <div class="notice" style="font-size:24px">🐄 you'll join next round!</div>
    <div class="notice">current scores</div>
    <div id="waiting-next-scores" style="width:100%"></div>
  </div>
</div>

<div class="screen" id="screen-question">
  <div class="card">
    <div class="notice" id="round-label">round 1</div>
    <div id="question-text"></div>
    <input type="text" id="input-answer" placeholder="your answer...">
    <button id="submit-btn" onclick="submitAnswer()">submit</button>
    <div class="notice" id="answer-notice"></div>
  </div>
</div>

<div class="screen" id="screen-results">
  <div class="card" style="max-width:560px">
    <div class="notice" style="font-size:22px;font-weight:bold">answers</div>
    <div class="results-scroll" id="answers-list"></div>
    <div class="notice" style="font-size:22px;font-weight:bold">scoreboard</div>
    <div class="results-scroll" id="scoreboard-list"></div>
    <button id="next-round-btn" style="display:none" onclick="nextRound()">next round ▶</button>
    <div class="notice" id="next-notice">waiting for host to start next round...</div>
    <button class="secondary" onclick="quitGame()">quit game</button>
  </div>
</div>

<div class="screen" id="screen-winner">
  <div class="card">
    <div class="notice" style="font-size:28px">🏆 winner!</div>
    <div id="winner-name"></div>
    <button onclick="location.reload()">play again</button>
  </div>
</div>

<script>
let ws;
let myName = "";
let roomCode = "";
let isHost = false;
let gameStarted = false;
let isWaitingNextRound = false;

function showScreen(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

function showSidebar() {
    document.getElementById("sidebar").style.display = "block";
}

function updateSidebar(scoreboard) {
    const div = document.getElementById("sidebar-scores");
    const sorted = Object.entries(scoreboard).sort((a, b) => b[1] - a[1]);
    div.innerHTML = sorted.map(([name, score]) =>
        `<div class="sidebar-row"><span>${name}</span><span>${score}</span></div>`
    ).join("");
}

function showPreRound(round, scoreboard) {
    document.getElementById("pre-round-label").textContent = `round ${round} starting!`;
    const div = document.getElementById("pre-round-scoreboard");
    const sorted = Object.entries(scoreboard).sort((a, b) => b[1] - a[1]);
    div.innerHTML = sorted.map(([name, score]) =>
        `<div class="pre-score-row"><span>${name}</span><span>${score} pts</span></div>`
    ).join("");
    showScreen("screen-pre-round");

    let count = 3;
    document.getElementById("pre-round-countdown").textContent = `starting in ${count}...`;
    const interval = setInterval(() => {
        count--;
        if (count <= 0) {
            clearInterval(interval);
        } else {
            document.getElementById("pre-round-countdown").textContent = `starting in ${count}...`;
        }
    }, 1000);
}

function connect(onOpen) {
    ws = new WebSocket("ws://localhost:8000");
    ws.onopen = onOpen;
    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        handleMessage(data);
    };
    ws.onerror = () => {
        document.getElementById("join-error").textContent = "Could not connect to server. Is server.py running?";
    };
    ws.onclose = () => {
        if (gameStarted) {
            alert("Disconnected from server.");
        }
    };
}

function createRoom() {
    myName = document.getElementById("input-name").value.trim();
    if (!myName) { document.getElementById("join-error").textContent = "Enter your name!"; return; }
    isHost = true;
    connect(() => {
        ws.send(JSON.stringify({ action: "create", name: myName }));
    });
}

function joinRoom() {
    myName = document.getElementById("input-name").value.trim();
    const code = document.getElementById("input-code").value.trim().toUpperCase();
    if (!myName) { document.getElementById("join-error").textContent = "Enter your name!"; return; }
    if (!code)   { document.getElementById("join-error").textContent = "Enter a room code!"; return; }
    isHost = false;
    connect(() => {
        ws.send(JSON.stringify({ action: "join", name: myName, code: code }));
    });
}

function startGame() {
    ws.send(JSON.stringify({ action: "start", code: roomCode }));
}

function submitAnswer() {
    const answer = document.getElementById("input-answer").value.trim();
    if (!answer) return;
    ws.send(JSON.stringify({ action: "answer", code: roomCode, answer: answer }));
    document.getElementById("input-answer").value = "";
    document.getElementById("input-answer").disabled = true;
    document.getElementById("submit-btn").disabled = true;
}

function nextRound() {
    ws.send(JSON.stringify({ action: "next_round" }));
}

function quitGame() {
    ws.send(JSON.stringify({ action: "quit" }));
    location.reload();
}

function handleMessage(data) {

    if (data.type === "created") {
        roomCode = data.code;
        document.getElementById("lobby-code").textContent = roomCode;
        updatePlayerList(data.players);
        document.getElementById("start-btn").style.display = "block";
        document.getElementById("waiting-notice").style.display = "none";
        showScreen("screen-lobby");
    }

    else if (data.type === "lobby") {
        if (data.code) roomCode = data.code;
        document.getElementById("lobby-code").textContent = roomCode;
        updatePlayerList(data.players);
        if (!gameStarted) showScreen("screen-lobby");
    }

    else if (data.type === "waiting_next_round") {
        gameStarted = true;
        isWaitingNextRound = true;
        showSidebar();
        updateSidebar(data.scoreboard);
        const div = document.getElementById("waiting-next-scores");
        const sorted = Object.entries(data.scoreboard).sort((a, b) => b[1] - a[1]);
        div.innerHTML = sorted.map(([name, score]) =>
            `<div class="pre-score-row"><span>${name}</span><span>${score} pts</span></div>`
        ).join("");
        showScreen("screen-waiting-next");
    }

    else if (data.type === "error") {
        document.getElementById("join-error").textContent = data.message;
        document.getElementById("lobby-error").textContent = data.message;
    }

    else if (data.type === "question") {
        gameStarted = true;
        isWaitingNextRound = false;
        showSidebar();
        updateSidebar(data.scoreboard);

        showPreRound(data.round, data.scoreboard);
        setTimeout(() => {
            document.getElementById("round-label").textContent = `round ${data.round}`;
            document.getElementById("question-text").textContent = data.question;
            document.getElementById("answer-notice").textContent = "";
            document.getElementById("input-answer").disabled = false;
            document.getElementById("input-answer").value = "";
            document.getElementById("submit-btn").disabled = false;
            showScreen("screen-question");
        }, 3000);
    }

    else if (data.type === "waiting") {
        document.getElementById("answer-notice").textContent = "✅ answer received! waiting for others...";
    }

    else if (data.type === "results") {
        updateSidebar(data.scoreboard);
        buildResults(data.answers, data.scoreboard);
        document.getElementById("next-round-btn").style.display = "none";
        document.getElementById("next-notice").style.display = "block";
        showScreen("screen-results");
    }

    else if (data.type === "results_host") {
        updateSidebar(data.scoreboard);
        buildResults(data.answers, data.scoreboard);
        document.getElementById("next-round-btn").style.display = "block";
        document.getElementById("next-notice").style.display = "none";
        showScreen("screen-results");
    }

    else if (data.type === "winner") {
        document.getElementById("winner-name").textContent = `${data.name} 🐄`;
        showScreen("screen-winner");
    }

    else if (data.type === "game_quit") {
        alert("The host has ended the game!");
        location.reload();
    }
}

function buildResults(answers, scoreboard) {
    const answersDiv = document.getElementById("answers-list");
    const scoreDiv   = document.getElementById("scoreboard-list");
    answersDiv.innerHTML = "";
    scoreDiv.innerHTML   = "";

    for (const [name, answer] of Object.entries(answers)) {
        answersDiv.innerHTML += `<div class="answer-row"><span>${name}</span><span>${answer}</span></div>`;
    }
    const sorted = Object.entries(scoreboard).sort((a, b) => b[1] - a[1]);
    for (const [name, score] of sorted) {
        scoreDiv.innerHTML += `<div class="score-row"><span>${name}</span><span>${score} pts</span></div>`;
    }
}

function updatePlayerList(players) {
    const ul = document.getElementById("player-list");
    ul.innerHTML = players.map(p => `<li>${p}</li>`).join("");
}

document.getElementById("input-answer").addEventListener("keydown", e => {
    if (e.key === "Enter") submitAnswer();
});
</script>
</body>
</html>
